{% load static %}

<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>{% block page_title %}Sistema Integrado{% endblock %}</title>

    <link rel="icon" type="image/png" href="/static/img/logo.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .modal-xl {
            max-width: 95%;
        }

        /* Expandindo o modal para ocupar quase toda a tela */
        .table-responsive {
            max-height: 70vh;
            overflow-y: auto;
        }

        th {
            background-color: #f8f9fa;
            position: sticky;
            top: 0;
            z-index: 1;
        }

        .table {
            font-size: 0.85rem;
            white-space: nowrap;
        }
    </style>
    <style>
        /* PALETA DE CORES GLOBAL */
        :root {
            --verde-principal: #00A34F;
            --branco: #FFFFFF;
            --azul-escuro: #13162F;
            --verde-claro: #B7C958;
            --dourado: #FFD700;
            --cinza-fundo: #F4F6F9;
            --cinza-borda: #E0E5EC;
            --vermelho-alerta: #E64759;
        }

        /* RESET E TIPOGRAFIA BASE */
        body {
            font-family: 'Poppins', sans-serif;
            font-size: 13px;
            background-color: var(--cinza-fundo);
            color: #333;
            margin: 0;
            padding: 0 0 20px 0;
        }

        /* NAVBAR CORPORATIVA */
        .app-header {
            background-color: var(--azul-escuro);
            box-shadow: 0 4px 12px rgba(19, 22, 47, 0.15);
            margin-bottom: 24px;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .app-nav {
            display: flex;
            align-items: center;
            padding: 0 24px;
            height: 70px;
            max-width: 1600px;
            margin: 0 auto;
        }

        .app-nav__brand {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--branco);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-right: 30px;
            letter-spacing: 0.5px;
        }

        .app-nav__brand i {
            color: var(--verde-principal);
            font-size: 1.5rem;
        }

        .app-nav__links {
            display: flex;
            gap: 8px;
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .app-nav__link {
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 500;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .app-nav__link:hover {
            color: var(--verde-claro);
            background-color: rgba(255, 255, 255, 0.05);
        }

        .app-nav__link.active {
            color: var(--branco);
            background-color: var(--verde-principal);
        }

        .app-nav__spacer {
            flex: 1 1 auto;
        }

        /* BOTÃO DE SAIR */
        .app-nav__logout {
            margin: 0;
            display: flex;
            align-items: center;
        }

        .app-nav__logout button {
            background: transparent;
            border: 1px solid var(--vermelho-alerta);
            color: var(--vermelho-alerta);
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .app-nav__logout button:hover {
            background: var(--vermelho-alerta);
            color: var(--branco);
            box-shadow: 0 2px 8px rgba(230, 71, 89, 0.3);
        }

        /* CONTAINER PRINCIPAL */
        .main-content {
            max-width: 1600px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* CONFIGURAÇÕES GLOBAIS DATATABLES */
        table.dataTable tbody th,
        table.dataTable tbody td {
            padding: 8px 10px !important;
            white-space: nowrap;
            vertical-align: middle;
        }

        table.dataTable thead th {
            background-color: var(--azul-escuro);
            color: var(--branco);
            font-weight: 500;
            padding: 12px 10px !important;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: none !important;
        }

        .text-truncate {
            max-width: 180px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            display: block;
        }

        .text-right {
            text-align: right;
        }

        .text-center {
            text-align: center;
        }

        table.dataTable tbody tr:hover {
            background-color: rgba(183, 201, 88, 0.1) !important;
        }

        /* RESPONSIVIDADE NAVBAR */
        @media (max-width: 768px) {
            .app-nav {
                flex-wrap: wrap;
                height: auto;
                padding: 15px;
                gap: 15px;
            }

            .app-nav__spacer {
                display: none;
            }

            .app-nav__links {
                width: 100%;
                justify-content: center;
                margin: 0;
            }

            .app-nav__logout {
                width: 100%;
                justify-content: center;
            }

            .main-content {
                padding: 0 10px;
            }
        }
    </style>

    {% block scripts_head %}{% endblock %}
</head>

<body>
    <header class="app-header">
        <nav class="app-nav">
            <a class="app-nav__brand" href="{% url 'lista_notas' %}?data_emissao_month={{selected_month}}">
                <i class="fa-solid fa-industry"></i> Análise de Margem
            </a>

            <ul class="app-nav__links">
                <li>
                    <a class="app-nav__link {% if request.resolver_match.url_name == 'lista_notas' %}active{% endif %}"
                        href="{% url 'lista_notas' %}?data_emissao_month={{selected_month}}">
                        <i class="fa-solid fa-table-list"></i> Notas
                    </a>
                </li>
                <li>
                    <a class="app-nav__link {% if request.resolver_match.url_name == 'estatisticas' %}active{% endif %}"
                        href="{% url 'estatisticas' %}?data_emissao_month={{selected_month}}">
                        <i class="fa-solid fa-chart-pie"></i> Estatísticas
                    </a>
                </li>
                <li>
                    {% if request.user.is_superuser %}
                    <a href="{% url 'admin_justificativas' %}"
                        class="app-nav__link {% if request.resolver_match.url_name == 'admin_justificativas' %}active{% endif %}"
                        title="Gerenciar aplicação">
                        <i class="fa-solid fa-user-shield"></i> Administração
                    </a>
                    {% endif %}
                </li>
            </ul>

            <span class="app-nav__spacer" aria-hidden="true"></span>

            <form class="app-nav__logout" action="{% url 'logout' %}" method="post">
                {% csrf_token %}
                <button type="submit">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i> Sair
                </button>
            </form>
        </nav>
    </header>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
