{% extends 'base.html' %}

{% block page_title %}Requisição Inválida{% endblock %}

{% block content %}
<div class="container text-center mt-5 pt-5">
    <i class="fa-solid fa-circle-xmark text-warning" style="font-size: 5rem; margin-bottom: 20px;"></i>
    <h1 class="display-4 font-weight-bold" style="color: var(--azul-escuro);">400</h1>
    <h2 class="mb-4">Requisição Inválida</h2>
    <p class="lead mb-5 text-muted">A requisição não pôde ser processada devido a uma sintaxe incorreta ou erro do cliente.</p>
    <a href="{% url 'lista_notas' %}?data_emissao_month={% now 'Y-m' %}" class="btn" style="background-color: var(--verde-principal); color: var(--branco); font-weight: 500; padding: 10px 25px; text-decoration: none;">
        <i class="fa-solid fa-house"></i> Voltar ao Início
    </a>
</div>
{% endblock %}
